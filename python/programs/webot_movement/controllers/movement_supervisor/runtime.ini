; Tell Webots R2025a to launch this controller with the system Python
; interpreter (not the one bundled with Webots), so that the `bleak`
; package installed in your environment is importable.
;
; If you use a virtualenv or conda env, change COMMAND to its full path,
; e.g. on Windows:
;   COMMAND = C:\Users\you\.conda\envs\tinyml\python.exe
; or on macOS/Linux:
;   COMMAND = /path/to/.venv/bin/python

[python]
; Absolute path to the conda env Python so this works regardless of how
; Webots is launched (Start-menu shortcut, Recent Worlds, double-click, etc).
; Without an absolute path, a Webots launched from a Windows shortcut inherits
; explorer.exe's PATH (which usually does not include your conda env), the
; controller spawn fails or finds the wrong Python, and the GUI exits silently.
; Change this if your env lives elsewhere.
COMMAND = C:\Users\Linh B Ngo\.conda\envs\tinyml\python.exe
